<!doctype html>
<html><head><meta charset="utf-8"><title>Mock Cursor workbench</title></head>
<body>
  <!-- settings chrome (allowlisted root) -->
  <div class="cursor-settings-sidebar-content">
    <div class="cursor-settings-sidebar-cell"><span class="cursor-settings-sidebar-cell-label" id="tab-plan">Plan &amp; Usage</span></div>
    <div class="cursor-settings-sidebar-cell"><span class="cursor-settings-sidebar-cell-label" id="tab-general">General</span></div>
    <input class="cursor-settings-sidebar-search-input" id="search" placeholder="Typography" value="Typography">
  </div>
  <div class="cursor-settings-pane-content" id="pane">
    <h2 id="h-layout">  Layout  </h2>
    <div class="cursor-settings-cell-label" id="cell-label">Window Restoration</div>
    <div id="lbl-density" title="Conversation Density">Conversation Density</div>
    <button id="btn" aria-label="Reduce Motion">Reduce Motion</button>
    <div id="mix">Startup<b id="mix-b">Theme</b> Not In Dict</div>
    <textarea id="ta" placeholder="Privacy">Privacy</textarea>
    <input id="inp" value="Privacy" title="Privacy">
    <div id="ce" contenteditable="true"><p id="ce-p">Privacy</p></div>
    <div class="monaco-editor"><span id="monaco">Privacy</span></div>
    <div class="xterm"><span id="xterm">Privacy</span></div>
    <div data-message-role="assistant"><p id="msg">Privacy</p></div>
    <div class="aislash-editor-input"><span id="chatin">Privacy</span></div>
    <code id="code">Privacy</code>
  </div>
  <!-- outside settings: must stay English in scope=settings -->
  <div id="outside">Privacy</div>
</body></html>
